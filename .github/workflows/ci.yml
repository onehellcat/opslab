name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opslab
          POSTGRES_USER: opslab
          POSTGRES_PASSWORD: development
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opslab -d opslab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: app

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: opslab
      DATABASE_USER: opslab
      DATABASE_PASSWORD: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Check frontend scripts parse
        run: for file in public/*.js public/ui-kit/*.js; do node --check "$file"; done

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t opslab-api:test .

  infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate Kubernetes manifests
        run: docker run --rm -v "$PWD/kubernetes:/manifests:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /manifests

      - name: Validate Compose file
        run: docker compose --profile observe config --quiet

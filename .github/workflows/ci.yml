name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opslab
          POSTGRES_USER: opslab
          POSTGRES_PASSWORD: development
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opslab -d opslab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: app

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: opslab
      DATABASE_USER: opslab
      DATABASE_PASSWORD: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Check frontend scripts parse
        run: for file in public/*.js public/ui-kit/*.js; do node --check "$file"; done

      - name: Run API tests
        run: npm test

  browser:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Keep traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: app/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    needs: [test, browser]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t opslab-api:ci app

      # Fixable critical vulnerabilities fail the build; high ones are listed for review.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: opslab-api:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: List high-severity findings
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: opslab-api:ci
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Generate software bill of materials
        uses: anchore/sbom-action@v0
        with:
          image: opslab-api:ci
          format: spdx-json
          artifact-name: opslab-api.spdx.json

      - name: Push image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/opslab-api"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag opslab-api:ci "$image:${GITHUB_SHA::12}"
          docker tag opslab-api:ci "$image:latest"
          docker push "$image:${GITHUB_SHA::12}"
          docker push "$image:latest"

  infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate Kubernetes manifests
        run: docker run --rm -v "$PWD/kubernetes:/manifests:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /manifests

      - name: Validate Compose file
        run: docker compose --profile observe config --quiet

      - name: Validate alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/observability:/rules:ro" prom/prometheus:v2.54.1 check rules /rules/alerts.yml

name: opslab

services:
  api:
    image: opslab-api:local
    pull_policy: build
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "${OPSLAB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: opslab
      DATABASE_USER: opslab
      DATABASE_PASSWORD: development
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:3000/'), fetch('http://127.0.0.1:3000/health/live')]).then(rs => process.exit(rs.every(r => r.ok) ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: opslab-postgres
    environment:
      POSTGRES_DB: opslab
      POSTGRES_USER: opslab
      POSTGRES_PASSWORD: development
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opslab -d opslab"]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

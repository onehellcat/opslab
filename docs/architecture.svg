<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">OpsLab local delivery architecture</title><desc id="desc">Developer source flows through GitHub Actions and Docker into a local Kubernetes cluster. The running API connects to PostgreSQL.</desc><defs><style>.bg{fill:#10120f}.lane{fill:#1b1e19;stroke:#41463d;stroke-width:2}.box{fill:#f7f7f0;stroke:#b8f337;stroke-width:3}.box2{fill:#20241e;stroke:#b8f337;stroke-width:3}.t{font:700 22px Arial,sans-serif;fill:#10120f}.s{font:14px Arial,sans-serif;fill:#4b5148}.w{font:700 20px Arial,sans-serif;fill:#f7f7f0}.ws{font:14px Arial,sans-serif;fill:#c6ccc2}.l{stroke:#b8f337;stroke-width:3;fill:none}.label{font:700 13px Arial,sans-serif;letter-spacing:1.5px;fill:#b8f337}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b8f337"/></marker></defs><rect class="bg" width="1200" height="420" rx="18"/><text x="48" y="55" class="label">OPSLAB · LOCAL-FIRST DELIVERY PATH</text><rect class="lane" x="42" y="85" width="1116" height="135" rx="12"/><rect class="box" x="76" y="117" width="155" height="72" rx="9"/><text x="105" y="151" class="t">Source</text><text x="98" y="174" class="s">TypeScript app</text><path class="l" d="M231 153 H287" marker-end="url(#arrow)"/><rect class="box" x="299" y="117" width="155" height="72" rx="9"/><text x="326" y="151" class="t">CI</text><text x="319" y="174" class="s">GitHub Actions</text><path class="l" d="M454 153 H510" marker-end="url(#arrow)"/><rect class="box" x="522" y="117" width="155" height="72" rx="9"/><text x="548" y="151" class="t">Image</text><text x="542" y="174" class="s">Docker build</text><path class="l" d="M677 153 H733" marker-end="url(#arrow)"/><rect class="box2" x="745" y="105" width="372" height="95" rx="10"/><text x="774" y="143" class="w">Local Kubernetes</text><text x="774" y="169" class="ws">k3d · Deployment · Service · probes</text><path class="l" d="M931 201 V270" marker-end="url(#arrow)"/><rect class="lane" x="42" y="270" width="1116" height="105" rx="12"/><rect class="box" x="595" y="294" width="170" height="57" rx="9"/><text x="630" y="328" class="t">Fastify API</text><path class="l" d="M765 323 H840" marker-end="url(#arrow)"/><rect class="box" x="852" y="294" width="190" height="57" rx="9"/><text x="884" y="328" class="t">PostgreSQL 16</text><path class="l" d="M482 323 H565" marker-end="url(#arrow)"/><text x="83" y="330" class="w">Browser &amp; learning UI</text><text x="83" y="352" class="ws">Interactive pipeline · API playground</text></svg>
